[read_based_het]
# Discover extra het (SNP/indel) anchors from reads, in the gap between adjacent snarls,
# via POA (abpoa) of the common reads' inter-snarl subsequences. The synthetic het snarls
# are injected into the candidate set BEFORE reliability filtering so they are vetted the
# same way as graph-derived snarls. Requires DISABLE_EXTENSION_AND_MERGING = True (the
# synthetic anchors carry no graph nodes, so extension/merging cannot run on them).
ENABLE_READ_BASED_HET_FINDING = False
ABPOA_BINARY = /private/groups/migalab/shnegi/apps/abPOA-v1.5.6/bin/abpoa
# Min common reads (across all alleles) between the two snarls to bother searching a gap.
MIN_COMMON_READS = 6
# Min inter-snarl gap (bp) on a read to search.
MIN_GAP_BP = 3
# A het column/event needs each of its 2 alleles at >= MIN_ALLELE_FRAC of depth AND
# >= MIN_ALLELE_READS reads; the 'other' bases (3rd/4th allele + gaps) must be <= MAX_OTHER_FRAC.
MIN_ALLELE_FRAC = 0.35
MIN_ALLELE_READS = 3
MAX_OTHER_FRAC = 0.10
# Min reads per allele after byte-identical consensus filtering; else the site is dropped.
MIN_ANCHOR_READS_PER_ALLELE = 2
# Also call insertion/deletion events (not just SNP columns).
CALL_INDELS = True
# Skip intervals whose median gap exceeds this many bp (0 = no cap).
MAX_INTERVAL_BP = 50000
